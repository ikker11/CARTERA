<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Cartera</title>
  <meta name="description" content="Tu economía personal con Nova, tu asistente que aprende de ti.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cartera">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" id="theme-color" content="#F2F2F7">
  <script>
    // Aplica el tema elegido antes de pintar la app (sin parpadeos)
    (function () {
      var pref = 'auto';
      try { pref = (JSON.parse(localStorage.getItem('cartera.v1') || '{}').settings || {}).theme || 'auto'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.getElementById('theme-color').setAttribute('content', dark ? '#000000' : '#F2F2F7');
    })();
  </script>
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Pantalla de bloqueo con PIN -->
  <div id="lock" class="lock hidden" aria-live="polite">
    <img src="icon-180.png" alt="" class="lock-icon">
    <div class="lock-title">Introduce tu código</div>
    <div class="pin-dots"><span></span><span></span><span></span><span></span></div>
    <div class="pin-pad"></div>
  </div>

  <main id="screens">
    <section id="screen-home" class="screen active" data-screen="home"></section>
    <section id="screen-movs" class="screen" data-screen="movs"></section>
    <section id="screen-save" class="screen" data-screen="save"></section>
    <section id="screen-nova" class="screen" data-screen="nova"></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="home" aria-label="Inicio">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Inicio</span>
    </button>
    <button class="tab" data-tab="movs" aria-label="Movimientos">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round" fill="none" stroke-width="2.2"/></svg>
      <span>Movimientos</span>
    </button>
    <button class="tab-add" id="tab-add" aria-label="Añadir movimiento">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-linecap="round" stroke-width="2.6" fill="none"/></svg>
    </button>
    <button class="tab" data-tab="save" aria-label="Ahorro">
      <svg viewBox="0 0 24 24"><path d="M19 9.5c.9.3 2 1 2 2.5 0 1.3-1 1.8-1.6 2-.5 1.6-1.6 2.9-3.1 3.6V20h-3v-1.5h-3V20h-3v-2.6C5.2 16.3 4 14.3 4 12c0-3.9 3.6-6.5 8-6.5 1.4 0 2.6.3 3.7.7L18 4.5v4.2c.4.2.7.5 1 .8zM15.5 11a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg>
      <span>Ahorro</span>
    </button>
    <button class="tab" data-tab="nova" aria-label="Nova">
      <svg viewBox="0 0 24 24"><path d="M12 2c.7 4.6 2.4 6.3 7 7-4.6.7-6.3 2.4-7 7-.7-4.6-2.4-6.3-7-7 4.6-.7 6.3-2.4 7-7zM19 15c.3 2 1 2.7 3 3-2 .3-2.7 1-3 3-.3-2-1-2.7-3-3 2-.3 2.7-1 3-3z"/></svg>
      <span>Nova</span>
    </button>
  </nav>

  <!-- Hoja inferior estilo iOS -->
  <div id="sheet-backdrop" class="sheet-backdrop"></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grabber"></div>
    <div id="sheet-body"></div>
  </div>

  <!-- Alertas -->
  <div id="alert" class="alert-wrap hidden"></div>
  <div id="toast" class="toast"></div>

  <input type="file" id="ticket-input" accept="image/*" capture="environment" hidden>
  <input type="file" id="ticket-input-lib" accept="image/*" hidden>
  <input type="file" id="import-input" accept="application/json,.json" hidden>

  <script src="nova.js"></script>
  <script src="app.js"></script>
</body>
</html>
